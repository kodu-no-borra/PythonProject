services:
  db:
    image: postgres:16-alpine
    container_name: dev_postgres
    ports:
      - "5433:5432"
    env_file: .env.compose
    volumes:
      - postgres_data:/var/lib/postgresql/data/

  web:
    build: .
    container_name: dev_django
    command: poetry run python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    env_file: .env.compose
    depends_on:
      - db
    volumes:
      - .:/app

volumes:
  postgres_data: